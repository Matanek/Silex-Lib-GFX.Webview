name: Validate WebView portability

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out GFX.WebView
        uses: actions/checkout@v6
        with:
          path: GFX.WebView

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: d2d8907131de1b0f0de9c8741b0fed020cf60925
          path: _silex

      - name: Check out the exact STD checkpoint
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex-Lib-STD
          ref: 94adcd6747a3edd01a3b8552b46f12b087c7cdae
          path: STD

      - name: Check out the exact GFX checkpoint
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex-Lib-GFX
          ref: f7019091e808a87059400b1c07b45be8dcf315a2
          path: GFX

      - name: Install WebKitGTK and Zig
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Build Silex
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/silex-prefix" \
            --build-file _silex/Toolchain/build.zig

      - name: Run the Linux WebKitGTK adapter
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          silex="$RUNNER_TEMP/silex-prefix/bin/silex"
          "$silex" setup
          "$silex" link "$GITHUB_WORKSPACE/STD"
          "$silex" install JSON
          "$silex" link "$GITHUB_WORKSPACE/GFX"
          "$silex" link "$GITHUB_WORKSPACE/GFX.WebView"
          webview_output=$(xvfb-run -a env GDK_BACKEND=x11 SDL_VIDEO_DRIVER=x11 \
            NO_AT_BRIDGE=1 LIBGL_ALWAYS_SOFTWARE=1 \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            "$silex" test "$GITHUB_WORKSPACE/GFX.WebView/Tests")
          printf '%s\n' "$webview_output"
          grep -Fxq '5 passed; 0 failed in 4 files' <<< "$webview_output"

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out GFX.WebView
        uses: actions/checkout@v6
        with:
          path: GFX.WebView

      - name: Check out the Silex compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: d2d8907131de1b0f0de9c8741b0fed020cf60925
          path: _silex

      - name: Check out the exact STD checkpoint
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex-Lib-STD
          ref: 94adcd6747a3edd01a3b8552b46f12b087c7cdae
          path: STD

      - name: Check out the exact GFX checkpoint
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex-Lib-GFX
          ref: f7019091e808a87059400b1c07b45be8dcf315a2
          path: GFX

      - name: Install Zig
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e") {
            throw "Zig archive checksum mismatch"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0")

      - name: Build Silex
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          zig build -Doptimize=ReleaseFast -Dcpu=baseline `
            --prefix "$env:RUNNER_TEMP/silex-prefix" `
            --build-file _silex/Toolchain/build.zig

      - name: Run the Windows WebView2 adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $silex = Join-Path $env:RUNNER_TEMP "silex-prefix/bin/silex.exe"
          & $silex setup
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "STD")
          & $silex install JSON
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "GFX")
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "GFX.WebView")
          $webViewOutput = @(& $silex test (Join-Path $env:GITHUB_WORKSPACE "GFX.WebView/Tests"))
          $testExitCode = $LASTEXITCODE
          $webViewOutput | ForEach-Object { Write-Output $_ }
          if ($testExitCode -ne 0 -or -not ($webViewOutput -contains "5 passed; 0 failed in 4 files")) {
            throw "expected all four WebView test files to pass, native exit code: $testExitCode"
          }

      - name: Cross-compile the Windows ARM64 fragment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home-arm64"
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $silex = Join-Path $env:RUNNER_TEMP "silex-prefix/bin/silex.exe"
          & $silex setup
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "STD") --target windows-arm64
          & $silex install JSON --target windows-arm64
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "GFX") --target windows-arm64
          & $silex link (Join-Path $env:GITHUB_WORKSPACE "GFX.WebView") --target windows-arm64
          & $silex compile (Join-Path $env:GITHUB_WORKSPACE "GFX.WebView/Examples/BridgeWebPage.sx") `
            --target windows-arm64 `
            -o (Join-Path $env:RUNNER_TEMP "webview-arm64.exe")
